name: Bug report
description: Report a reproducible problem in Utter for macOS.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach recordings, transcripts, logs containing user text, secrets, or personal file paths.
  - type: input
    id: version
    attributes:
      label: Utter version
      placeholder: e.g. 1.1.57
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model and memory
      description: Include Apple Silicon generation or Intel model if known.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal example and replace private content with placeholders.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, recordings, transcripts, secrets, and identifying paths.
          required: true

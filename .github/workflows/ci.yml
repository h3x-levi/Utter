name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
            echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          swift --version

      - name: Build UtterCore
        run: swift build --target UtterCore

      - name: Build app and test targets (Requires macOS 26 SDK)
        continue-on-error: true
        run: |
          echo "Note: Full app build uses macOS 26 SDK features (Glass, ToolbarSpacer)."
          swift build

      - name: Run test suite (Requires macOS 26 SDK)
        continue-on-error: true
        run: swift test

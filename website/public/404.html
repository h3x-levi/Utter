<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Utter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .badge {
      font-family: monospace;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #a1a1aa;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 5rem;
      font-weight: 900;
      margin: 0 0 1rem;
      background: linear-gradient(180deg, #ffffff 0%, #71717a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.1rem;
      color: #a1a1aa;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a {
      background: #ffffff;
      color: #09090b;
      text-decoration: none;
      padding: 0.85rem 1.8rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="badge">ERROR 404 · AIR-GAPPED</div>
  <h1>Lost in Space</h1>
  <p>The page you are looking for does not exist on this device. All local Whisper neural weights are intact.</p>
  <a href="/">Return to Utter</a>
</body>
</html>

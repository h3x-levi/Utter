<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; script-src 'self'">
<style>
  @font-face { font-family: Nunito; src: url("../assets/fonts/Nunito.ttf"); font-weight: 200 1000; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding-bottom: 8px; box-sizing: border-box;
    font: 600 11.5px "Segoe UI Variable Text", "Segoe UI", Cantarell, "Noto Sans", Ubuntu, system-ui, sans-serif; }
  #pill { --red: #D8352A; --navy: #1C2A5E; --gold: #F1B632; --ink: #EEF2FB;
    display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box;
    height: 20px; width: 64px; padding: 0 8px; border-radius: 999px; background: var(--red); color: var(--ink);
    box-shadow: 0 2px 8px rgba(18, 20, 25, .28); white-space: nowrap; overflow: hidden;
    transition: width .18s ease, height .18s ease, background-color .18s ease; }
  #pill.rest { width: 32px; height: 6px; padding: 0; box-shadow: 0 1px 4px rgba(18, 20, 25, .25);
    background: linear-gradient(90deg, var(--red) 0 60%, var(--gold) 60% 80%, var(--navy) 80% 100%); }
  #pill.rest > * { display: none; }
  #pill.hover { width: 48px; height: 16px; background: var(--navy); cursor: pointer; }
  #pill.done, #pill.notice { background: var(--navy); }
  #pill.error { background: var(--gold); color: var(--navy); }
  #pill.handsFree, #pill.note, #pill.memory { width: 80px; }
  #pill.notice, #pill.error { width: auto; max-width: 260px; min-width: 64px; padding: 0 10px; }
  #pill.hidden { opacity: 0; }
  #pill.dot { width: 8px; height: 8px; padding: 0; background: var(--gold); cursor: pointer; }
  #pill.dot > *, #pill.island { display: none; }
  #caption { display: none; max-width: 300px; padding: 6px 10px; border-radius: 10px; background: #121419; color: #EEF2FB;
    font-weight: 500; font-size: 13px; line-height: 1.35; box-shadow: 0 2px 10px rgba(18, 20, 25, .3);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #caption:empty, #caption[hidden] { display: none; }
  #island { display: none; width: 360px; box-sizing: border-box; border-radius: 22px; overflow: hidden; background: #121419; color: #DFE6FF;
    border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 6px 22px rgba(18, 20, 25, .35); }
  #island.open { display: block; }
  #island .tape { height: 4px; background: linear-gradient(90deg, #D8352A 0 69%, #F1B632 69% 85%, #5B6AA8 85% 100%); }
  #island .body { padding: 10px 12px 10px; }
  #island .why { color: #9AA0AE; font-weight: 400; font-size: 11px; margin: 0 0 6px; }
  #island .words { font-weight: 400; font-size: 13.5px; line-height: 16px; margin: 0; max-height: 96px; overflow: hidden; white-space: pre-wrap;
    background: repeating-linear-gradient(transparent 0 15px, rgba(255, 255, 255, .08) 15px 16px); }
  #island .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #island button { font: 800 11px Nunito, sans-serif; letter-spacing: .14em; text-transform: uppercase; height: 24px; padding: 0 12px;
    border-radius: 999px; cursor: pointer; border: 1.5px solid rgba(238, 242, 251, .55); background: transparent; color: #EEF2FB; }
  #island button.fill { background: #EEF2FB; border-color: #EEF2FB; color: #121419; }
  #island button:active { transform: scale(.97); }
  #island .esc { margin-left: auto; color: #9AA0AE; font-weight: 400; font-size: 11px; display: flex; align-items: center; gap: 5px; }
  #island kbd { font: 600 10.5px "Segoe UI", sans-serif; color: #EEF2FB; border: 1px solid rgba(238, 242, 251, .35); border-radius: 5px; padding: 1px 5px; }
  .bars { display: flex; align-items: center; gap: 3.2px; height: 14px; }
  .bars i { display: block; width: 2px; height: 3px; border-radius: 1px; background: currentColor; }
  .label { overflow: hidden; text-overflow: ellipsis; }
  .glyph, .check, .bang, .dots, .label, .bars { display: none; }
  .listening .bars, .thinking .bars, .handsFree .bars, .note .bars, .memory .bars, .hover .bars { display: flex; }
  .hover .bars { height: 10px; }
  .handsFree .glyph.lock, .note .glyph.page, .memory .glyph.brain, .hover .glyph.lock { display: block; }
  .done .check, .error .bang, .notice .dots, .notice .label, .error .label { display: block; }
  .bang { font-weight: 800; }
  .dots { letter-spacing: 1px; font-size: 9px; }
  svg { display: block; }
  @media (prefers-reduced-motion: reduce) { #pill { transition: none; } }
</style>
</head>
<body>
  <div id="caption" aria-live="polite" hidden></div>
  <div id="island" role="dialog" aria-label="Your words">
    <div class="tape"></div>
    <div class="body">
      <p class="why">No text box selected, so your words are here</p>
      <p class="words"></p>
      <div class="row">
        <button class="fill" data-action="island-copy">Copy</button>
        <button data-action="island-note">Save as note</button>
        <span class="esc"><kbd>Esc</kbd> to close</span>
      </div>
    </div>
  </div>
  <div id="pill" class="rest" role="status" aria-live="polite">
    <span class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <svg class="glyph lock" width="9" height="11" viewBox="0 0 9 11" aria-hidden="true"><rect x="0.5" y="4.5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M2.5 4.5V3a2 2 0 0 1 4 0v1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    <svg class="glyph page" width="10" height="11" viewBox="0 0 10 11" aria-hidden="true"><rect x="0.7" y="0.7" width="8.6" height="9.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3 4h4M3 6.3h4" stroke="currentColor" stroke-width="1.2"/></svg>
    <svg class="glyph brain" width="12" height="11" viewBox="0 0 12 11" aria-hidden="true"><path d="M6 1.2v8.6M6 2.2A2.2 2.2 0 0 0 2.2 3a2 2 0 0 0-.9 3.3A2.1 2.1 0 0 0 3.6 9.6 1.9 1.9 0 0 0 6 9.8M6 2.2A2.2 2.2 0 0 1 9.8 3a2 2 0 0 1 .9 3.3 2.1 2.1 0 0 1-2.3 3.3A1.9 1.9 0 0 1 6 9.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <svg class="check" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1.5 5.2 4.4 8 10.5 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="bang">!</span>
    <span class="dots">••••••</span>
    <span class="label"></span>
  </div>
  <script src="pill.js"></script>
</body>
</html>
